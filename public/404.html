<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InterviewAI</title>
    <script>
      // SPA redirect for GitHub Pages
      const path = window.location.pathname;
      const base = '/Interview_Agent_2';
      const route = path.replace(base, '') || '/';
      sessionStorage.setItem('redirect', route);
      window.location.replace(base + '/#' + route);
    </script>
  </head>
  <body></body>
</html>
